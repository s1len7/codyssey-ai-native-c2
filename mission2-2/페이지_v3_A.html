<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111318">
  <title>Codyssey Landing Page</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --card: #1b1e26;
      --card-hover: #252a35;
      --border: #303541;
      --text: #f1f3f8;
      --muted: #9299a8;
      --accent: #7c9cff;
      --danger: #ff7777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(900px, calc(100% - 36px));
      margin: 0 auto;
      padding: 70px 0 50px;
    }

    header {
      text-align: center;
      margin-bottom: 42px;
    }

    h1 {
      display: inline-block;
      margin: 0;
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 800;
      letter-spacing: -1.2px;
      cursor: pointer;
      user-select: none;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .device-info {
      margin-top: 12px;
      color: #727b8d;
      font-size: 12px;
    }

    .section-title {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .service-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 100px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      transition:
        background 0.2s,
        border-color 0.2s,
        transform 0.2s;
      cursor: pointer;
    }

    .service-card:hover {
      background: var(--card-hover);
      border-color: #59647a;
      transform: translateY(-3px);
    }

    .service-card:active {
      transform: scale(0.98);
    }

    .icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.07);
    }

    .service-icon {
      display: block;
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .icon-fallback {
      display: none;
      font-size: 25px;
      line-height: 1;
    }

    .service-name {
      font-size: 15px;
      font-weight: 650;
    }

    .service-description {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .custom-card {
      padding-right: 42px;
    }

    .delete-button {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #777f8e;
      font-size: 17px;
      cursor: pointer;
    }

    .delete-button:hover {
      background: rgba(255, 100, 100, 0.12);
      color: var(--danger);
    }

    .email-card {
      margin-top: 14px;
      min-height: 75px;
    }

    .email-card .icon-wrap {
      width: 38px;
      height: 38px;
      font-size: 21px;
    }

    .email-notice {
      display: none;
      margin-top: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .custom-section {
      margin-top: 38px;
    }

    .form-panel {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 2fr auto;
      gap: 10px;
    }

    .form-row input {
      width: 100%;
      min-width: 0;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #12151b;
      color: var(--text);
      font-size: 14px;
    }

    .form-row input:focus {
      border-color: var(--accent);
    }

    .add-button {
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-button:hover {
      filter: brightness(1.1);
    }

    .form-message {
      min-height: 20px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .form-message.error {
      color: var(--danger);
    }

    .form-message.success {
      color: #82d9a5;
    }

    footer {
      margin-top: 45px;
      color: #646c7b;
      font-size: 12px;
      text-align: center;
    }

    /* 이스터 에그 */
    #poopRain {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      pointer-events: none;
    }

    .poop {
      position: absolute;
      top: -60px;
      animation-name: poopFall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      will-change: transform;
    }

    @keyframes poopFall {
      from {
        transform: translateY(-60px) rotate(0deg);
      }
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    .poop-message {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: clamp(28px, 7vw, 56px);
      font-weight: 900;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
      animation: messagePop 0.5s ease-out;
    }

    @keyframes messagePop {
      from {
        opacity: 0;
        scale: 0.3;
      }
      to {
        opacity: 1;
        scale: 1;
      }
    }

    @media (max-width: 650px) {
      .container {
        padding-top: 45px;
      }

      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .service-card {
        min-height: 88px;
        gap: 11px;
        padding: 14px;
      }

      .icon-wrap {
        width: 38px;
        height: 38px;
      }

      .service-icon {
        width: 26px;
        height: 26px;
      }

      .service-name {
        font-size: 13px;
      }

      .service-description {
        font-size: 11px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .add-button {
        min-height: 43px;
      }
    }

    @media (max-width: 360px) {
      .container {
        width: calc(100% - 24px);
      }

      .service-card {
        gap: 8px;
        padding: 10px;
      }

      .icon-wrap {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1 id="pageTitle">Codyssey Landing Page</h1>
      <div class="subtitle">All your learning tools in one place.</div>
      <div class="device-info" id="deviceInfo"></div>
    </header>

    <section>
      <h2 class="section-title">QUICK ACCESS</h2>
      <div class="card-grid" id="serviceGrid"></div>

      <a
        class="service-card email-card"
        href="mailto:qna@innoaca.kr"
        id="emailCard"
      >
        <div class="icon-wrap">✉️</div>
        <div>
          <div class="service-name">운영진 문의</div>
          <div class="service-description">qna@innoaca.kr</div>
        </div>
      </a>

      <div class="email-notice" id="emailNotice">
        메일 앱이 열리지 않는다면 아래 주소로 직접 문의해 주세요.<br>
        <strong>qna@innoaca.kr</strong>
      </div>
    </section>

    <section class="custom-section">
      <h2 class="section-title">MY SHORTCUTS</h2>

      <div class="form-panel">
        <form id="siteForm">
          <div class="form-row">
            <input
              type="text"
              id="siteName"
              placeholder="사이트 이름"
              maxlength="20"
              autocomplete="off"
              required
            >

            <input
              type="text"
              id="siteUrl"
              placeholder="사이트 URL (예: notion.so)"
              autocomplete="url"
              required
            >

            <button type="submit" class="add-button">
              + 사이트 추가
            </button>
          </div>
        </form>

        <div class="form-message" id="formMessage" aria-live="polite"></div>
      </div>

      <div class="card-grid" id="customGrid" style="margin-top: 14px;"></div>
    </section>

    <footer>
      Codyssey Landing Page
    </footer>

  </main>

  <div id="poopRain"></div>

  <script>
    // ==========================================
    // 기본 서비스 목록
    // ==========================================

    const defaultSites = [
      {
        name: "Codyssey",
        description: "AI Native Learning",
        url: "https://codyssey.kr",
        icon: "https://www.google.com/s2/favicons?domain=codyssey.kr&sz=128",
        fallback: "🎓"
      },
      {
        name: "GitHub",
        description: "Code Repository",
        url: "https://github.com",
        icon: "https://upload.wikimedia.org/wikipedia/commons/c/c2/GitHub_Invertocat_Logo.svg?utm_source=ko.wikipedia.org&utm_campaign=index&utm_content=original",
        fallback: "🐙"
      },
      {
        name: "Discord",
        description: "Community",
        url: "https://discord.com/app",
        icon: "https://cdn.simpleicons.org/discord/5865F2",
        fallback: "💬"
      },
      {
        name: "ChatGPT",
        description: "AI Assistant",
        url: "https://chatgpt.com",
        icon: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQROq6TUn52DjU4SyVdDFLvgvCEvPHdrDyh3eOw7guNzw&s",
        fallback: "🤖"
      },
      {
        name: "Gemini",
        description: "Google AI",
        url: "https://gemini.google.com",
        icon: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzHuef4PDf-oBNT9rr4pceUgA2VS-bmec4U5ozsWe4XQ&s=10",
        fallback: "✨"
      },
      {
        name: "Claude",
        description: "AI Assistant",
        url: "https://claude.ai",
        icon: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkZmO21qbqsKfUg1SxSMycZIvd1w9fYyPdeFhRw8m_4w&s=10",
        fallback: "🟠"
      }
    ];

    const STORAGE_KEY = "codyssey_custom_sites";

    let customSites = [];
    let storageAvailable = true;

    // ==========================================
    // 저장소 처리
    // ==========================================

    function initializeStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved !== null) {
          const parsed = JSON.parse(saved);

          if (!Array.isArray(parsed)) {
            throw new Error("저장 데이터 형식 오류");
          }

          customSites = parsed.filter(site =>
            site &&
            typeof site.name === "string" &&
            typeof site.url === "string" &&
            isSafeUrl(site.url)
          );
        }
      } catch (error) {
        customSites = [];
        storageAvailable = false;

        showMessage(
          "저장된 데이터가 손상되었거나 저장소를 사용할 수 없습니다. 기본 상태로 시작합니다.",
          "error"
        );
      }
    }

    function saveSites() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(customSites)
        );

        storageAvailable = true;
      } catch (error) {
        storageAvailable = false;

        showMessage(
          "저장소를 사용할 수 없어 이번 세션에서만 유지됩니다.",
          "error"
        );
      }
    }

    // ==========================================
    // URL 검증
    // ==========================================

    function normalizeUrl(value) {
      let url = value.trim();

      if (!url) {
        throw new Error("URL을 입력해 주세요.");
      }

      if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)) {
        url = "https://" + url;
      }

      let parsed;

      try {
        parsed = new URL(url);
      } catch {
        throw new Error("올바른 URL 형식이 아닙니다.");
      }

      if (
        parsed.protocol !== "http:" &&
        parsed.protocol !== "https:"
      ) {
        throw new Error("HTTP 또는 HTTPS 주소만 사용할 수 있습니다.");
      }

      if (!parsed.hostname || !parsed.hostname.includes(".")) {
        throw new Error("올바른 도메인 주소를 입력해 주세요.");
      }

      if (parsed.username || parsed.password) {
        throw new Error("사용자 인증 정보가 포함된 URL은 사용할 수 없습니다.");
      }

      return parsed.href;
    }

    function isSafeUrl(value) {
      try {
        const parsed = new URL(value);

        return (
          (parsed.protocol === "http:" || parsed.protocol === "https:") &&
          parsed.hostname.includes(".") &&
          !parsed.username &&
          !parsed.password
        );
      } catch {
        return false;
      }
    }

    function getComparableUrl(value) {
      const parsed = new URL(value);

      parsed.hash = "";

      return parsed.href.replace(/\/+$/, "").toLowerCase();
    }

    // ==========================================
    // 메시지 표시
    // ==========================================

    function showMessage(message, type = "") {
      const element = document.getElementById("formMessage");

      element.textContent = message;
      element.className = "form-message";

      if (type) {
        element.classList.add(type);
      }
    }

    // ==========================================
    // 아이콘 생성
    // ==========================================

    function createIcon(site) {
      const wrapper = document.createElement("div");
      wrapper.className = "icon-wrap";

      const img = document.createElement("img");
      img.className = "service-icon";
      img.src = site.icon;
      img.alt = site.name;

      const fallback = document.createElement("span");
      fallback.className = "icon-fallback";
      fallback.textContent = site.fallback || "🔗";

      img.onerror = function () {
        img.style.display = "none";
        fallback.style.display = "block";
      };

      wrapper.appendChild(img);
      wrapper.appendChild(fallback);

      return wrapper;
    }

    // ==========================================
    // 기본 서비스 카드 렌더링
    // ==========================================

    function renderDefaultSites() {
      const grid = document.getElementById("serviceGrid");

      grid.replaceChildren();

      defaultSites.forEach(site => {
        const card = document.createElement("a");

        card.className = "service-card";
        card.href = site.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        const icon = createIcon(site);

        const info = document.createElement("div");

        const name = document.createElement("div");
        name.className = "service-name";
        name.textContent = site.name;

        const description = document.createElement("div");
        description.className = "service-description";
        description.textContent = site.description;

        info.append(name, description);
        card.append(icon, info);

        grid.appendChild(card);
      });
    }

    // ==========================================
    // 커스텀 사이트 렌더링
    // ==========================================

    function renderCustomSites() {
      const grid = document.getElementById("customGrid");

      grid.replaceChildren();

      customSites.forEach((site, index) => {
        const card = document.createElement("a");

        card.className = "service-card custom-card";
        card.href = site.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";

        const icon = document.createElement("div");
        icon.className = "icon-wrap";
        icon.textContent = "🔗";

        const info = document.createElement("div");

        const name = document.createElement("div");
        name.className = "service-name";
        name.textContent = site.name;

        const description = document.createElement("div");
        description.className = "service-description";
        description.textContent = new URL(site.url).hostname;

        info.append(name, description);
        card.append(icon, info);

        const deleteButton = document.createElement("button");

        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.title = "사이트 삭제";
        deleteButton.setAttribute("aria-label", site.name + " 삭제");

        deleteButton.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();

          deleteSite(index);
        });

        card.appendChild(deleteButton);
        grid.appendChild(card);
      });
    }

    // ==========================================
    // 사이트 추가
    // ==========================================

    document.getElementById("siteForm").addEventListener("submit", event => {
      event.preventDefault();

      const nameInput = document.getElementById("siteName");
      const urlInput = document.getElementById("siteUrl");

      const name = nameInput.value.trim();

      if (!name) {
        showMessage("사이트 이름을 입력해 주세요.", "error");
        nameInput.focus();
        return;
      }

      if (name.length > 20) {
        showMessage("사이트 이름은 20자 이하로 입력해 주세요.", "error");
        return;
      }

      let url;

      try {
        url = normalizeUrl(urlInput.value);
      } catch (error) {
        showMessage(error.message, "error");
        urlInput.focus();
        return;
      }

      const normalized = getComparableUrl(url);

      const duplicate = [
        ...defaultSites,
        ...customSites
      ].some(site => {
        return getComparableUrl(site.url) === normalized;
      });

      if (duplicate) {
        showMessage("이미 추가된 사이트입니다.", "error");
        return;
      }

      customSites.push({
        name,
        url
      });

      saveSites();
      renderCustomSites();

      nameInput.value = "";
      urlInput.value = "";

      if (storageAvailable) {
        showMessage("사이트가 추가되었습니다.", "success");
      } else {
        showMessage(
          "사이트가 추가되었습니다. 단, 이번 세션에서만 유지됩니다.",
          "error"
        );
      }
    });

    // ==========================================
    // 사이트 삭제
    // ==========================================

    function deleteSite(index) {
      const site = customSites[index];

      if (!site) return;

      const confirmed = confirm(
        `"${site.name}" 사이트를 삭제하시겠습니까?`
      );

      if (!confirmed) return;

      customSites.splice(index, 1);

      saveSites();
      renderCustomSites();

      showMessage("사이트가 삭제되었습니다.", "success");
    }

    // ==========================================
    // 이메일 안내
    // ==========================================

    document.getElementById("emailCard").addEventListener("click", () => {
      document.getElementById("emailNotice").style.display = "block";
    });

    // ==========================================
    // 기기 구분
    // ==========================================

    function detectDevice() {
      const ua = navigator.userAgent;

      if (/iPhone|iPad|iPod/i.test(ua)) {
        return "iOS";
      }

      if (/Android/i.test(ua)) {
        return "Android";
      }

      if (/Windows/i.test(ua)) {
        return "Windows Desktop";
      }

      if (/Macintosh|Mac OS/i.test(ua)) {
        return "Mac Desktop";
      }

      if (/Linux/i.test(ua)) {
        return "Linux Desktop";
      }

      return "Unknown Device";
    }

    document.getElementById("deviceInfo").textContent =
      detectDevice();

    // ==========================================
    // 이스터 에그
    // 제목을 2초 이내 7번 클릭하면 똥 비 애니메이션
    // ==========================================

    let titleClickCount = 0;
    let lastTitleClick = 0;
    let easterEggRunning = false;

    const title = document.getElementById("pageTitle");
    const poopRain = document.getElementById("poopRain");

    title.addEventListener("click", () => {
      const now = Date.now();

      if (now - lastTitleClick > 2000) {
        titleClickCount = 0;
      }

      lastTitleClick = now;
      titleClickCount++;

      if (titleClickCount >= 7 && !easterEggRunning) {
        titleClickCount = 0;
        startPoopRain();
      }
    });

    function startPoopRain() {
      if (easterEggRunning) return;

      easterEggRunning = true;
      poopRain.replaceChildren();

      const message = document.createElement("div");
      message.className = "poop-message";
      message.textContent = "💩 SURPRISE! 💩";

      poopRain.appendChild(message);

      const poopCount = 90;

      for (let i = 0; i < poopCount; i++) {
        const poop = document.createElement("div");

        poop.className = "poop";
        poop.textContent = "💩";

        const left = Math.random() * 100;
        const size = 18 + Math.random() * 28;
        const duration = 3 + Math.random() * 3.5;
        const delay = Math.random() * 2.5;

        poop.style.left = left + "vw";
        poop.style.fontSize = size + "px";
        poop.style.animationDuration = duration + "s";
        poop.style.animationDelay = delay + "s";

        poopRain.appendChild(poop);
      }

      setTimeout(() => {
        poopRain.replaceChildren();
        easterEggRunning = false;
      }, 8000);
    }

    // ==========================================
    // 초기 실행
    // ==========================================

    initializeStorage();
    renderDefaultSites();
    renderCustomSites();

  </script>
</body>
</html>
